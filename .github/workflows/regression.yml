name: regression
on:
  pull_request:
  push:
    branches: ['security/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.4'
      - name: Install without lifecycle hooks
        working-directory: tools/cc-sdd
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and test with a dummy home
        working-directory: tools/cc-sdd
        run: |
          mkdir -p "$RUNNER_TEMP/ccsdd-home"
          env -i HOME="$RUNNER_TEMP/ccsdd-home" PATH="$PATH" CI=true npm run build --ignore-scripts
          env -i HOME="$RUNNER_TEMP/ccsdd-home" PATH="$PATH" CI=true node scripts/add-shebang.mjs
          env -i HOME="$RUNNER_TEMP/ccsdd-home" PATH="$PATH" CI=true npm test --ignore-scripts
