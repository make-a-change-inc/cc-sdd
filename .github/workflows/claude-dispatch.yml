# IMPORTANT: Do not move this file in your repo! Make sure it's located at .github/workflows/claude-dispatch.yml
name: Claude Code Dispatch

# IMPORTANT: Do not modify this `on` section!
on:
  repository_dispatch:
    types: [claude-dispatch]

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
    steps:
      - name: Require current write permission before loading agent code or credentials
        id: permission
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" --jq '.permission') || exit 1
          case "$permission" in
            admin|maintain|write) echo 'allowed=true' >> "$GITHUB_OUTPUT" ;;
            *) echo 'allowed=false' >> "$GITHUB_OUTPUT" ;;
          esac
  claude-dispatch:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write 
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      # - name: Preliminary Setup
        # run: |
          # echo "Setting up environment..."
          # Add any preliminary setup commands here to setup Claude's dev environment
          # e.g., npm install, etc.

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@9278e593553fcd1b65eede335d8c7e7e80da92db # eap
        with:
          mode: 'remote-agent'
          
          # Optional: Specify an API key, otherwise we'll use your Claude account automatically
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Optional: Specify model (defaults to Claude Sonnet 4, uncomment for Claude Opus 4)
          # model: "claude-opus-4-20250514"

          # Optional: Allow Claude to run specific commands
          # allowed_tools: |
            # Bash(npm run lint)
            # Bash(npm run test)
            # Bash(npm run build)

          # Optional: Custom environment variables for Claude
          # claude_env: |
          #   NODE_ENV: test
