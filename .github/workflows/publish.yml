name: Publish Package
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'
      - name: Install without lifecycle hooks
        working-directory: tools/cc-sdd
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build, test and pack
        working-directory: tools/cc-sdd
        run: |
          npm run build --ignore-scripts
          node scripts/add-shebang.mjs
          npm test --ignore-scripts
          npm pack --ignore-scripts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: tools/cc-sdd/*.tgz
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'
          registry-url: 'https://registry.npmjs.org'
      - name: Select official npm CLI
        run: npm install -g npm@11.19.1 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: package-artifact
      - name: Publish verified tarball without project hooks
        run: npm publish package-artifact/*.tgz --ignore-scripts
